# AV Display settings. The installer copies this to /etc/av-display.conf.
# After changing it: sudo systemctl restart av-display

# Folder with the photos and videos (sub-folders are included). Shown in name order,
# so number files to set the order: 01-welcome.jpg, 02-video.mp4, ...
MEDIA_DIR=/home/pi/media

# How long each photo stays on screen, in seconds. Videos always play to the end.
IMAGE_SECONDS=10

# yes = random order each time round, no = name order
SHUFFLE=no

# Video sound: hdmi (through the TV), local (headphone jack), both
AUDIO=hdmi

# yes = if a USB stick is plugged in, show it instead of MEDIA_DIR.
# Uses a folder named USB_FOLDER on the stick if there is one, otherwise the whole stick.
USE_USB=yes
USB_FOLDER=slideshow

# ---- Network folder (optional) ----
# A shared folder on a Windows server / NAS. It is copied to the Pi's SD card every
# NETWORK_SYNC_MINUTES and played from there (smooth video, keeps going if the network drops).
# Write it with forward slashes:  \\server\share\Lobby TV  ->  NETWORK_SHARE="//server/share/Lobby TV"
# (smb://server/share and \\server\share are also accepted and converted.)
# Leave empty to turn off. A plugged-in USB stick still takes priority.
NETWORK_SHARE=
# Leave NETWORK_USER empty for a share anyone can open (guest).
NETWORK_USER=
NETWORK_PASSWORD=
# Windows domain, if the account needs one (e.g. HUDSON). Usually empty.
NETWORK_DOMAIN=
# Extra mount options. For an old NAS that won't connect, try: vers=2.0  or  vers=1.0
NETWORK_OPTIONS=
NETWORK_SYNC_MINUTES=15
