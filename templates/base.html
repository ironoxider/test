<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Device Inventory{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Device Inventory</a>
    <nav>
      <a href="{{ url_for('index') }}">Devices</a>
      <a href="{{ url_for('locations') }}">Locations</a>
      <a href="{{ url_for('lists') }}">Lists</a>
      <a href="{{ url_for('import_csv') }}">Import</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a class="button" href="{{ url_for('device_new') }}">+ Add device</a>
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
